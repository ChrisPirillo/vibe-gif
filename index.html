        body {

            padding: 20px; box-sizing: border-box; 
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);

        }
        @media (min-width: 768px) {
            body.menu-open #canvas-container {

        /* New Panel Transitions */
        #settings-panel { 
            transform: translateY(-100%); /* Hidden top on mobile */
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1); 
            will-change: transform; 
        }
        #settings-panel.open {
            transform: translateY(0);
        }
        @media (min-width: 768px) {
            #settings-panel {
                transform: translateX(100%); /* Hidden right on desktop */
            }
            #settings-panel.open {
                transform: translateX(0);
            }

    <script>
        const config = {
            text: "VIBE\nGIF",
            fontFamily: "Inter",
            textColor: "#ffffff",
            strokeColor: "#000000",
            bgMode: "solid",
            bgColor1: "#000000",
            bgColor2: "#1a1a1a",
            animMode: "liquid",
            colorMode: "solid",
            padding: 40,
            tracking: 0,
            speed: 1, 
            amplitude: 30,
            strokeWidth: 0,
            shadowBlur: 0,
            aspectRatio: { w: 0, h: 0 },
            gifDuration: 5.0,
            gifFps: 24,
            gifWidth: 480
        };

        const state = {
            width: 800,
            height: 800,
            time: 0,
            isMenuOpen: true, // Default open
            isRendering: false,
            workerUrl: null,
            transitionAlpha: 0,
            transitionStage: 'none',
            fontsReady: false,
            textInteracted: false // New state to track if user touched text
        };

        // --- NEW: Deterministic Pseudo-Random Helper ---
        // Guarantees that for any specific 'seed' (based on time + index), 
        // the output is always the same. Used to replace Math.random().
        function pseudoRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        async function setupGifWorker() {
            try {
                const res = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
                const blob = new Blob([await res.text()], { type: 'application/javascript' });
                state.workerUrl = URL.createObjectURL(blob);
            } catch (e) { console.warn("Worker Load Fail"); }
        }

        const canvas = document.getElementById('canvas');
        // --- CHANGED: Enable alpha for transparent preview ---
        const ctx = canvas.getContext('2d', { alpha: true });

        function init() {
            setupGifWorker();
            resize(); 
            window.addEventListener('resize', resize);
            setupUI();
            
            document.fonts.ready.then(() => {
                state.fontsReady = true;
                performRandomize();
            });
            
            requestAnimationFrame(loop);
        }

        function resize() {
            const baseSize = 1000;
            if (config.aspectRatio.w === 0) {
                state.width = baseSize;
                state.height = baseSize;
            } else {
                state.width = Math.round(baseSize * (config.aspectRatio.w / Math.min(config.aspectRatio.w, config.aspectRatio.h)));
                state.height = Math.round(baseSize * (config.aspectRatio.h / Math.min(config.aspectRatio.w, config.aspectRatio.h)));
            }
            canvas.width = state.width;
            canvas.height = state.height;
            canvas.style.aspectRatio = `${state.width} / ${state.height}`;

            // HARD CANVAS RESET (Critical Fix)
            ctx.setTransform(1, 0, 0, 1, 0, 0); 
            ctx.globalAlpha = 1;
            ctx.filter = 'none';
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            ctx.textAlign = 'start';
            ctx.textBaseline = 'alphabetic';
            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0,0,state.width,state.height);
            ctx.beginPath();
        }

        function drawBackground(c, w, h, loopProgress, isExport, matteColor = null) {
            c.save();
            
            if (config.bgMode === 'transparent') {
                if (isExport && matteColor) {
                    // Use the calculated adaptive matte color
                    c.fillStyle = matteColor; 
                    c.fillRect(0,0,w,h);
                } else {
                    // Preview or no matte: Explicitly clear
                    c.clearRect(0,0,w,h);
                }
            } else if (config.bgMode === 'solid') {
                c.fillStyle = config.bgColor1;
                c.fillRect(0, 0, w, h);
            } 
            else if (config.bgMode === 'gradient') {
                const grad = c.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, config.bgColor1);
                grad.addColorStop(1, config.bgColor2);
                c.fillStyle = grad;
                c.fillRect(0, 0, w, h);
            }
            else if (config.bgMode === 'animated') {
                const mix = (Math.sin(loopProgress * Math.PI * 2) + 1) / 2;
                c.fillStyle = config.bgColor1;
                c.fillRect(0, 0, w, h);
                c.fillStyle = config.bgColor2;
                c.globalAlpha = mix;
                c.fillRect(0, 0, w, h);
            } else {
                // Failsafe solid fill
                c.fillStyle = '#000000';
                c.fillRect(0,0,w,h);
            }
            c.restore();
        }

        function calculateAutoFit(c, w, h, textLines, font, padding, tracking) {
            const testSize = 200;
            c.font = `900 ${testSize}px '${font}'`;
            let maxW = 0;
            
            if (textLines.length === 0 || (textLines.length === 1 && textLines[0] === '')) return 100;

            textLines.forEach(l => { 
                const m = c.measureText(l); 
                const wWithTrack = m.width + (Math.max(0, l.length-1)) * (tracking * (testSize/1000));
                if(wWithTrack > maxW) maxW = wWithTrack; 
            });
            
            const totalH = textLines.length * (testSize * 1.0);
            const availW = w - (padding * 2);
            const availH = h - (padding * 2);
            
            if (maxW <= 0 || totalH <= 0) return 100;
            
            const scale = Math.min(availW / maxW, availH / totalH) * 0.85;
            const size = Math.floor(testSize * scale);
            
            if (!isFinite(size) || size <= 0) return 10;
            return size;
        }

        function draw(dt, time, customCtx = null, customW = null, customH = null, matteColor = null) {
            if (!state.fontsReady) return;

            const c = customCtx || ctx;
            const w = customW || state.width;
            const h = customH || state.height;
            const isExport = !!customCtx;
            
            // 1. HARD CANVAS RESET (Critical Fix for Glitches)
            c.setTransform(1, 0, 0, 1, 0, 0); 
            c.globalAlpha = 1;
            c.filter = 'none';
            c.shadowBlur = 0;
            c.shadowColor = 'transparent'; // Force clear shadow color
            c.textAlign = 'start'; // Reset alignment to default
            c.textBaseline = 'alphabetic'; // Reset baseline to default
            c.globalCompositeOperation = 'source-over';
            c.clearRect(0,0,w,h);
            c.beginPath(); // Clear paths
            
            const duration = config.gifDuration;
            const rawProgress = (time % duration) / duration; 
            const safeSpeed = Math.round(config.speed) || 1;
            const cycle = rawProgress * Math.PI * 2;
            const pingPong = rawProgress < 0.5 ? rawProgress * 2 : 2 - (rawProgress * 2);

            // Pass the matte color to drawBackground if exporting
            drawBackground(c, w, h, rawProgress, isExport, matteColor);

            // 2. ROUND JOINS
            c.lineJoin = 'round';
            c.lineCap = 'round';
            c.miterLimit = 2; 

            try {
                const lines = config.text.toUpperCase().split('\n').map(l => l || ' ');
                const resScale = w / 1000; 
                const padding = config.padding * resScale * 2;
                const tracking = config.tracking * resScale;
                
                const fontSize = calculateAutoFit(c, w, h, lines, config.fontFamily, padding, config.tracking);
                
                c.font = `900 ${fontSize}px '${config.fontFamily}'`;
                c.textBaseline = 'middle'; 
                
                const lineHeight = fontSize * 1.0;
                const totalTextHeight = lines.length * lineHeight;
                
                // --- CENTERING FIX ---
                const opticalOffset = fontSize * 0.05; 
                const blockStartY = (h - totalTextHeight) / 2 + (lineHeight/2) + opticalOffset;

                lines.forEach((lineText, lineIdx) => {
                    const yBase = blockStartY + (lineIdx * lineHeight);
                    const rawWidth = c.measureText(lineText).width;
                    const trackWidth = (lineText.length > 1) ? (lineText.length - 1) * tracking : 0;
                    const totalLineWidth = rawWidth + trackWidth;
                    const startX = (w - totalLineWidth) / 2;

                    const centerLineIdx = (lines.length - 1) / 2;
                    const verticalCenterOffset = (lineIdx - centerLineIdx);

                    let conveyorShift = 0;
                    if(config.animMode === 'conveyor') {
                        const travel = w + totalLineWidth + fontSize;
                        const startPos = w + (totalLineWidth/2);
                        const currentPos = startPos - (rawProgress * travel);
                        conveyorShift = currentPos - (w/2);
                    }

                    for(let i=0; i<lineText.length; i++) {
                        let char = lineText[i];
                        
                        const prevText = lineText.substring(0, i);
                        const prevWidth = c.measureText(prevText).width;
                        const prevTrack = i * tracking;
                        const charWidth = c.measureText(char).width;
                        const centerX = startX + prevWidth + prevTrack + (charWidth / 2);
                        
                        let dx = centerX;
                        if(config.animMode === 'conveyor') dx += conveyorShift;

                        let dy = yBase;
                        let sx = 1, sy = 1, rot = 0, alpha = 1;
                        let skewX = 0, shearY = 0, blurAmt = 0;
                        let charColor = config.textColor;

                        const amp = config.amplitude * resScale;
                        const spd = safeSpeed;
                        const idxPhase = (i * 0.1) + (lineIdx * 0.5);
                        const wavePhase = cycle * spd + idxPhase;
                        const noise = (offset) => Math.sin(wavePhase * 5 + offset * 13);

                        if (config.colorMode !== 'solid') {
                            switch(config.colorMode) {
                                case 'spectrum': charColor = `hsl(${(wavePhase * 50) % 360}, 80%, 60%)`; break;
                                case 'warm': charColor = `hsl(${0 + Math.abs(Math.sin(wavePhase))*60}, 80%, 60%)`; break;
                                case 'cool': charColor = `hsl(${180 + Math.abs(Math.sin(wavePhase))*60}, 80%, 60%)`; break;
                                case 'synth': charColor = `hsl(${280 + Math.abs(Math.sin(wavePhase))*60}, 80%, 60%)`; break;
                                case 'matrix': charColor = `hsl(120, 100%, ${20 + Math.abs(Math.sin(wavePhase))*60}%)`; break;
                                case 'zebra': charColor = (i % 2 === 0) ? config.textColor : '#888888'; break;
                                case 'blink': 
                                    if (Math.sin(wavePhase * 0.5) < -0.5) charColor = 'transparent'; 
                                    break;
                                case 'noise': 
                                    const nStep = Math.floor(rawProgress * 10 + i * 0.2); 
                                    charColor = `hsl(${(nStep * 137.508) % 360}, 80%, 60%)`;
                                    break;
                                case 'glow': const lum = 50 + Math.sin(wavePhase*5)*40; charColor = `hsl(0, 0%, ${lum}%)`; break;
                                case 'mono': const g = 128 + Math.sin(wavePhase)*127; charColor = `rgb(${g},${g},${g})`; break;
                                case 'pastel': charColor = `hsl(${(wavePhase * 30) % 360}, 70%, 80%)`; break;
                                case 'sunset': charColor = `hsl(${340 + Math.sin(wavePhase)*40}, 80%, 60%)`; break;
                                case 'ocean': charColor = `hsl(${200 + Math.sin(wavePhase)*40}, 80%, 50%)`; break;
                                case 'forest': charColor = `hsl(${100 + Math.sin(wavePhase)*40}, 60%, 40%)`; break;
                                case 'candy': charColor = `hsl(${300 + Math.sin(wavePhase)*60}, 90%, 70%)`; break;
                                case 'gold': charColor = `hsl(${45 + Math.sin(wavePhase)*10}, 80%, ${50 + Math.cos(wavePhase)*20}%)`; break;
                                case 'sepia': charColor = `hsl(30, ${30 + Math.sin(wavePhase)*20}%, ${40 + Math.cos(wavePhase)*20}%)`; break;
                                case 'crimson': charColor = `hsl(${350 + Math.sin(wavePhase)*10}, 90%, 40%)`; break;
                                case 'midnight': charColor = `hsl(${240 + Math.sin(wavePhase)*20}, 60%, 30%)`; break;
                                case 'plasma': charColor = `hsl(${(wavePhase * 120) % 360}, 90%, 50%)`; break;
                                case 'soft': charColor = `hsl(${(wavePhase * 20) % 360}, 40%, 70%)`; break;
                                case 'hard': charColor = Math.sin(wavePhase) > 0 ? '#ff0000' : '#0000ff'; break;
                                case 'cmyk': 
                                    const cStep = Math.floor(rawProgress * 4 + i)%4;
                                    const cmyk = ['#00ffff', '#ff00ff', '#ffff00', '#000000'];
                                    charColor = cmyk[cStep];
                                    break;
                                case 'rainbow_swirl': charColor = `hsl(${(wavePhase * 100 + i * 20) % 360}, 100%, 50%)`; break;
                                case 'cyberpunk': charColor = Math.sin(wavePhase) > 0 ? '#00ffea' : '#ff0099'; break;
                                case 'vaporwave': charColor = Math.sin(wavePhase + i) > 0 ? '#ff71ce' : '#01cdfe'; break;
                                case 'heatmap': charColor = `hsl(${240 - (Math.abs(Math.sin(wavePhase)) * 240)}, 100%, 50%)`; break;
                                case 'toxic': charColor = `hsl(${280 + Math.sin(wavePhase)*100}, 100%, 50%)`; break;
                                case 'candy_cane': charColor = (i + lineIdx)%2 === 0 ? '#ff0000' : '#ffffff'; break;
                                case 'patriot': charColor = ['#ff0000', '#ffffff', '#0000ff'][i % 3]; break;
                                case 'galaxy': 
                                    // SLOWED DOWN GALAXY (Time-based, no random flicker)
                                    charColor = `hsl(${260 + Math.abs(Math.sin(time + i)) * 40}, ${70 + Math.cos(time * 2 + i) * 20}%, ${60 + Math.sin(time * 3 + i) * 20}%)`; 
                                    break;
                                case 'fire': 
                                    // SLOWED DOWN FIRE (Time-based, no random flicker)
                                    charColor = `hsl(${0 + Math.abs(Math.sin(time * 2 + i)) * 40}, 100%, ${50 + Math.abs(Math.cos(time * 3 + i)) * 40}%)`; 
                                    break;
                                case 'ice': charColor = `hsl(${180 + Math.sin(wavePhase)*20}, 100%, ${80 + Math.cos(wavePhase)*20}%)`; break;
                                case 'liquid_gold': charColor = `hsl(50, 100%, ${30 + Math.abs(Math.sin(dx/50 + time*2))*60}%)`; break;
                                case 'chrome': charColor = `hsl(0, 0%, ${Math.abs(Math.sin(wavePhase + dx/100)) * 100}%)`; break;
                                case 'hacker': charColor = Math.sin(time * 10) > 0.8 ? '#00ff00' : '#ffffff'; break;
                                case 'rgb_noise': charColor = ['#ff0000', '#00ff00', '#0000ff'][Math.floor(time * 4) % 3]; break;
                                case 'thermal': charColor = `hsl(${270 - Math.abs(Math.sin(wavePhase))*270}, 100%, 50%)`; break;
                                case 'cotton_candy': charColor = Math.sin(wavePhase) > 0 ? '#ff99cc' : '#99ccff'; break;
                                case 'vampire': charColor = Math.sin(wavePhase) > 0.5 ? '#ff0000' : '#000000'; break;
                                case 'bumblebee': charColor = Math.sin(wavePhase) > 0 ? '#ffff00' : '#000000'; break;
                                case 'blueprint': charColor = '#ffffff'; break; 
                                case 'pop_art': charColor = ['#ffff00', '#ff0000', '#0000ff'][Math.floor(Math.abs(Math.sin(wavePhase)*3))%3]; break;
                                case 'grayscale_noise': charColor = `hsl(0, 0%, ${(Math.sin(time * 5) + 1) * 50}%)`; break;
                                case 'psychedelic': charColor = `hsl(${(time * 500 + i * 50) % 360}, 100%, 50%)`; break;
                                // --- NEW COLORS (Non-flickery) ---
                                case 'aurora': charColor = `hsl(${120 + Math.sin(wavePhase)*60}, 80%, 50%)`; break;
                                case 'berry': charColor = `hsl(${300 + Math.sin(wavePhase)*30}, 70%, 40%)`; break;
                                case 'citrus': charColor = `hsl(${30 + Math.sin(wavePhase)*30}, 90%, 60%)`; break;
                                case 'coffee': charColor = `hsl(${30}, ${40 + Math.sin(wavePhase)*20}%, ${30 + Math.cos(wavePhase)*10}%)`; break;
                                case 'emerald': charColor = `hsl(${150 + Math.sin(wavePhase)*20}, 80%, 40%)`; break;
                                case 'lavender': charColor = `hsl(260, 60%, ${80 + Math.sin(wavePhase)*10}%)`; break;
                                case 'mint': charColor = `hsl(150, 70%, ${80 + Math.sin(wavePhase)*10}%)`; break;
                                case 'peachy': charColor = `hsl(20, 90%, ${70 + Math.sin(wavePhase)*10}%)`; break;
                                case 'royal': charColor = Math.sin(wavePhase) > 0 ? '#d4af37' : '#4b0082'; break;
                                case 'slate': charColor = `hsl(210, 20%, ${50 + Math.sin(wavePhase)*20}%)`; break;
                                case 'vintage_denim': charColor = `hsl(220, ${40 + Math.sin(wavePhase)*20}%, ${40 + Math.cos(wavePhase)*10}%)`; break;
                                case 'wine': charColor = `hsl(350, 80%, ${30 + Math.sin(wavePhase)*10}%)`; break;
                            }
                        }

                        // --- RESTORED ANIMATION LOGIC BLOCK START ---
                        if(config.animMode !== 'conveyor') {
                            switch(config.animMode) {
                                case 'stack': dy += Math.sin(wavePhase) * amp * verticalCenterOffset; break;
                                case 'leading': dy += Math.sin(cycle*spd) * amp * verticalCenterOffset; break;
                                case 'steps': dy += Math.floor(Math.sin(wavePhase)*5) * (amp/5); break;
                                case 'liquid': dy += Math.sin(wavePhase) * (amp * 0.5); sy = 1 + (Math.cos(wavePhase * 2) * (config.amplitude/300)); break;
                                case 'wave_y': dy += Math.sin(wavePhase) * amp; break;
                                case 'wave_x': dx += Math.cos(wavePhase) * amp; break;
                                case 'breathe': const breath = Math.sin(cycle * spd); sx = 1 + (breath * (config.amplitude/200)); sy = sx; break;
                                case 'pulse': const hb = Math.pow(Math.sin(cycle * spd * 3), 10); sx = 1 + (hb * (config.amplitude/100)); sy = sx; break;
                                case 'jelly': sy = 1 + Math.sin(wavePhase) * (config.amplitude/200); sx = 1 + Math.cos(wavePhase) * (config.amplitude/200); break;
                                case 'swing': rot = Math.sin(wavePhase) * (config.amplitude/100); break;
                                case 'rock': rot = Math.sin(cycle * spd) * (config.amplitude/100); break;
                                case 'shiver': dx += Math.sin(time * 12) * (amp/10); dy += Math.cos(time * 10) * (amp/10); break;
                                case 'pop': const p = Math.abs(Math.sin(wavePhase * 2)); sx = 1 + (p * amp/50); sy = sx; break;
                                case 'spin_y': sx = Math.cos(wavePhase); break;
                                case 'slide_x': dx += (pingPong * 2 - 1) * amp * 5; break;
                                case 'slide_y': dy += (pingPong * 2 - 1) * amp * 2; break;
                                case 'typewriter': const fullStr = lines.join(''); const reveal = Math.floor(fullStr.length * pingPong); const globalIdx = lines.slice(0, lineIdx).join('').length + i; if (globalIdx > reveal) alpha = 0; break;
                                case 'decode': if (Math.abs(Math.sin(wavePhase*2)) > (1 - (config.amplitude/200))) char = String.fromCharCode(65 + Math.floor(Math.abs(Math.sin(wavePhase*100)) * 26)); break;
                                case 'glitch': 
                                    if (Math.abs(noise(1)) > 0.95) { 
                                        dx += noise(2) * amp * 0.5; dy += noise(3) * amp * 0.5; 
                                    } 
                                    break;
                                case 'flicker': 
                                    if (Math.sin(wavePhase * 1) > 0.8) alpha = 0.3; 
                                    break;
                                case 'matrix': const drop = ((rawProgress * spd * 8) + i) % 15; if (drop < 2) alpha = 0.4; break;
                                case 'orbit': rot = wavePhase; dx += Math.cos(wavePhase) * amp; dy += Math.sin(wavePhase) * amp; break;
                                case 'twist': rot = (i - (lineText.length - 1) / 2) * Math.sin(cycle * spd) * 0.1; break; // Torsion Twist
                                case 'converge': blurAmt = (1 - pingPong) * (config.amplitude/2); break;
                                case 'scatter': const scat = (1 - pingPong) * amp; dx += (Math.sin(i * 123) * scat); dy += (Math.cos(i * 321) * scat); break;
                                case 'drift': dx += Math.sin(cycle*spd)*amp; dy += Math.cos(cycle*spd)*amp/2; rot=Math.sin(cycle)*0.1; break;
                                case 'float': dy += Math.sin(wavePhase)*amp; dx += Math.cos(wavePhase)*amp/3; break;
                                case 'tracking': dx += Math.sin(cycle*spd)*amp*i; break;
                                case 'shred': dx += Math.sin(i*100)*amp*pingPong; break;
                                case 'flip_x': sx = Math.cos(cycle * spd); break; // Global Flip
                                case 'flip_y': sy = Math.cos(wavePhase); break;
                                case 'z_depth': const z = 1 + Math.sin(wavePhase)*(amp/100); sx=z; sy=z; if(z<1) alpha=z; break;
                                case 'tumble': rot += rawProgress * Math.PI * 2 * spd; dy += Math.sin(rawProgress*Math.PI*2)*amp; break;
                                case 'ghost': alpha = 0.5 + Math.sin(wavePhase)*0.5; dx += Math.sin(wavePhase)*10; break;
                                case 'roll': rot = cycle * spd + (i * 0.5); break; // Propeller Roll
                                case 'accordion': sx = 0.5 + 0.5 * Math.sin(cycle*spd); break;
                                case 'cinema': alpha = Math.abs(Math.sin(cycle*spd)); blurAmt = (1-alpha)*10; break;
                                case 'focus': blurAmt = Math.abs(Math.sin(wavePhase)) * (amp/5); break;
                                case 'blocks': dx = Math.round(dx / 20) * 20; dy += Math.floor(Math.sin(wavePhase)*5) * 20; break;
                                case 'skew': skewX = Math.sin(cycle*spd)*(amp/100); break;
                                case 'shear': shearY = Math.sin(cycle*spd)*(amp/100); break;
                                case 'bounce_y': dy += Math.abs(Math.sin(wavePhase))*amp*-1; break;
                                case 'shimmy': dx += Math.sin(time * 50) * (amp/20); break;
                                case 'jolt': if (Math.abs(noise(6)) > 0.95) { dx += noise(7)*amp; dy += noise(8)*amp; } break;
                                case 'jitter': dx += Math.sin(cycle * 3 + i)*amp/10; dy += Math.cos(cycle * 2 + i)*amp/10; break; 
                                case 'inflate': const inf = 1 + Math.sin(cycle*spd)*(amp/100); sx=inf; sy=inf; break;
                                case 'compress': const comp = 1 - Math.sin(cycle*spd)*(amp/100); sx=comp; sy=comp; break;
                                case 'blink': 
                                    if (Math.sin(wavePhase * 0.5) < -0.5) alpha = 0; 
                                    break;
                                case 'scanline': alpha = 0.5 + 0.5 * Math.sin(dy/10 + cycle * 4); break;
                                case 'ooze': dy += Math.sin(dx/20 + time*5) * (amp/5); break;
                                case 'turbulence': dx += Math.sin(wavePhase * 3) * amp; dy += Math.cos(wavePhase * 2) * amp; rot = Math.sin(wavePhase) * 0.2; break;
                                case 'elastic': sx = 1 + Math.sin(cycle * spd) * (amp/100); break;
                                case 'swirl': rot = wavePhase * 0.5; break;
                                case 'tilt': sy = Math.cos(cycle*spd); break;
                                case 'squeeze': sx = 1 + Math.sin(cycle*spd)*(amp/50); sy = 1 - Math.sin(cycle*spd)*(amp/50); break;
                                case 'flash': 
                                    alpha = 0.5 + 0.5 * Math.sin(cycle*spd*0.5); 
                                    break;
                                case 'fade': alpha = 0.5 + 0.5 * Math.sin(wavePhase); break;
                                case 'blur_pulse': blurAmt = Math.abs(Math.sin(cycle*spd))*10; break;
                                case 'outline_pulse': break; 
                                case 'neon': break;
                                case 'barrel_roll': rot = cycle * spd; break;
                                case 'coin_spin': sx = Math.cos(cycle * spd); break;
                                case 'pendulum': 
                                    const penPivot = (h/2) - 200; 
                                    rot = Math.sin(cycle * spd) * (amp/100); 
                                    dx = startX + (dx - startX) * Math.cos(rot) - (dy - penPivot) * Math.sin(rot);
                                    dy = penPivot + (dx - startX) * Math.sin(rot) + (dy - penPivot) * Math.cos(rot);
                                    rot += Math.sin(cycle*spd)*0.1; // Add text rotation
                                    break;
                                case 'slinky': dy += Math.sin(idxPhase * 5 + cycle * spd) * amp; break;
                                case 'snap_back': dy += Math.sign(Math.sin(wavePhase)) * Math.pow(Math.abs(Math.sin(wavePhase)), 5) * amp; break;
                                case 'orbit_3d': 
                                    const z3d = 1 + Math.sin(cycle * spd) * 0.3; 
                                    dx += Math.cos(cycle * spd) * amp; 
                                    dy += Math.sin(cycle * spd) * (amp * 0.5);
                                    sx *= z3d; sy *= z3d; 
                                    if(z3d < 1) alpha *= z3d; 
                                    break;
                                case 'spiral': 
                                    const r = amp * Math.sin(cycle * spd); 
                                    dx += Math.cos(cycle * spd * 2) * r; 
                                    dy += Math.sin(cycle * spd * 2) * r; 
                                    break;
                                case 'zigzag': dx += (Math.asin(Math.sin(cycle * spd)) / (Math.PI/2)) * amp; break;
                                case 'bounce_x': dx += Math.abs(Math.sin(cycle*spd)) * amp; break;
                                case 'heartbeat_x': sx = 1 + Math.pow(Math.abs(Math.sin(cycle*spd)), 10) * (amp/50); sy = 1 - Math.pow(Math.abs(Math.sin(cycle*spd)), 10) * (amp/100); break;
                                case 'flag': dy += Math.sin(cycle * spd + (dx / 50)) * amp; break;
                                case 'fish_eye': 
                                    const distC = Math.sqrt(Math.pow(dx - (w/2), 2) + Math.pow(dy - (h/2), 2)); 
                                    const fish = 1 + Math.sin(cycle * spd - distC * 0.01) * (amp/50); 
                                    sx *= fish; sy *= fish; 
                                    break;
                                case 'ripple_out': 
                                    const distR = Math.sqrt(Math.pow(dx - (w/2), 2) + Math.pow(dy - (h/2), 2));
                                    const rip = Math.sin(cycle * spd * 2 - distR * 0.05) * amp;
                                    dy += rip;
                                    break;
                                case 'vortex': 
                                    const distV = Math.sqrt(Math.pow(dx - (w/2), 2) + Math.pow(dy - (h/2), 2));
                                    rot += (distV * 0.002) * Math.sin(cycle * spd);
                                    break;
                                case 'earthquake': 
                                    // --- CHANGED: Use Deterministic Pseudo-Random Noise ---
                                    // Previously: dx += (Math.random()-0.5)*amp*2;
                                    // This guarantees the 'shake' is identical on every frame for export consistency.
                                    const seedX = (time * 100) + (i * 13.1);
                                    const seedY = (time * 100) + (i * 17.5);
                                    const seedR = (time * 100) + (i * 19.3);
                                    dx += (pseudoRandom(seedX) - 0.5) * amp * 2;
                                    dy += (pseudoRandom(seedY) - 0.5) * amp * 2;
                                    rot += (pseudoRandom(seedR) - 0.5) * 0.1;
                                    break;
                                case 'strobe_rand': 
                                    if(Math.sin(cycle * spd * 4) > 0.8) alpha = 0.2; 
                                    break;
                                case 'fade_slide': dy += Math.sin(cycle*spd)*amp; alpha = 0.5 + 0.5*Math.sin(cycle*spd); break;
                                case 'stretch_jump': 
                                    const jump = Math.abs(Math.sin(cycle*spd));
                                    dy -= jump * amp; 
                                    sy = 1 + jump; sx = 1/sy; 
                                    break;
                                case 'checkerboard': 
                                    if((i + lineIdx) % 2 === 0) dy += Math.sin(cycle*spd)*amp; 
                                    else dy -= Math.sin(cycle*spd)*amp; 
                                    break;
                                case 'drunk': 
                                    dx += Math.sin(time * 1.5 + i) * amp + Math.sin(time * 0.5) * amp;
                                    dy += Math.cos(time * 1.2 + i) * amp;
                                    rot += Math.sin(time * 0.8 + i) * 0.2;
                                    break;
                                case 'pixel_snap': 
                                    const snap = Math.max(2, amp);
                                    dx = Math.round(dx / snap) * snap; 
                                    dy = Math.round(dy / snap) * snap; 
                                    break;
                            }
                        }
                        // --- RESTORED ANIMATION LOGIC BLOCK END ---

                        // WRAP IN TRY/FINALLY TO GUARANTEE RESTORE
                        c.save();
                        try {
                            c.translate(dx, dy);
                            c.rotate(rot);
                            c.scale(sx, sy);
                            
                            if (skewX !== 0 || shearY !== 0) c.transform(1, shearY, skewX, 1, 0, 0);
                            if (blurAmt > 0.5) c.filter = `blur(${blurAmt}px)`;
                            c.globalAlpha = alpha;
                            c.textAlign = 'center'; 
                            
                            // 1. STROKE (Bottom Layer) - INDEPENDENT
                            // Drawn first so it sits behind the fill.
                            // Shadow is explicitly disabled for the stroke to keep it clean.
                            if (config.strokeWidth > 0 || config.animMode === 'outline_pulse') {
                                c.save(); // Isolate stroke state
                                c.shadowColor = 'transparent'; 
                                c.shadowBlur = 0;
                                c.shadowOffsetX = 0;
                                c.shadowOffsetY = 0;
                                
                                c.strokeStyle = config.strokeColor;
                                if(config.animMode === 'outline_pulse') c.lineWidth = 1 + Math.abs(Math.sin(cycle*spd))*20;
                                else c.lineWidth = Math.max(1, config.strokeWidth * resScale);
                                c.strokeText(char, 0, 0);
                                c.restore();
                            }

                            // 2. SHADOW SETUP (Applied to Fill)
                            if (config.shadowBlur > 0 || config.animMode === 'neon') {
                                if (config.animMode !== 'neon') {
                                    // Hard Shadow Logic
                                    c.shadowColor = '#000000'; // Always dark/black
                                    c.shadowBlur = 0; // Hard edge, no blur
                                    
                                    // Map slider (0-100) to offset distance
                                    // 45 degree angle (X+ Y+)
                                    // Multiplier 0.15 makes slider range 0px to 15px
                                    const offset = (config.shadowBlur * 0.15) * resScale;
                                    c.shadowOffsetX = offset;
                                    c.shadowOffsetY = offset;
                                } else {
                                    // Neon still uses glow
                                    c.shadowColor = config.textColor; 
                                    c.shadowBlur = 20 + Math.abs(Math.sin(cycle*spd))*50;
                                    c.shadowOffsetX = 0;
                                    c.shadowOffsetY = 0;
                                }
                            } else {
                                c.shadowColor = 'transparent';
                                c.shadowBlur = 0;
                                c.shadowOffsetX = 0;
                                c.shadowOffsetY = 0;
                            }

                            // 3. FILL (Top Layer)
                            // The shadow configured above will apply to this fillText call.
                            if (config.animMode === 'glitch' && Math.abs(noise(5)) > 0.95) { // Safer threshold
                                c.fillStyle = '#f0f'; c.fillText(char, -2, 0);
                                c.fillStyle = '#0ff'; c.fillText(char, 2, 0);
                            } else {
                                c.fillStyle = charColor;
                                c.fillText(char, 0, 0);
                            }
                        } finally {
                            c.restore();
                        }
                    }
                });
            } catch (e) {
                // Ignore transient errors
            }

            if (state.transitionAlpha > 0 && !customCtx) {
                c.fillStyle = `rgba(0,0,0,${state.transitionAlpha})`;
                c.fillRect(0,0,w,h);
            }
        }

        function loop(timestamp) {
            requestAnimationFrame(loop);
            if (state.isRendering || !state.fontsReady) return;

            const dt = (timestamp - (state.lastTime || timestamp)) / 1000;
            state.lastTime = timestamp;
            state.time += dt;

            // Sync loop visually
            if (state.time > config.gifDuration) state.time %= config.gifDuration;

            if (state.transitionStage === 'out') {
                state.transitionAlpha += dt * 3;
                if(state.transitionAlpha >= 1) {
                    state.transitionAlpha = 1;
                    performRandomize();
                    state.transitionStage = 'in';
                }
            } else if (state.transitionStage === 'in') {
                state.transitionAlpha -= dt * 3;
                if(state.transitionAlpha <= 0) {
                    state.transitionAlpha = 0;
                    state.transitionStage = 'none';
                }
            }

            draw(dt, state.time);
        }

        function performRandomize() {
            // HARD CANVAS FLUSH ON RANDOMIZE
            canvas.width = state.width;
            canvas.height = state.height;
            
            const fonts = Array.from(document.getElementById('select-font').querySelectorAll('option')).map(o=>o.value);
            const modes = Array.from(document.getElementById('select-anim-mode').querySelectorAll('option')).map(o=>o.value).filter(v=>v!=='none');
            const colorModes = Array.from(document.getElementById('select-color-mode').querySelectorAll('option')).map(o=>o.value);
            const bgModes = ['solid','gradient','animated','transparent'];
            
            config.fontFamily = fonts[Math.floor(Math.random()*fonts.length)];
            config.animMode = modes[Math.floor(Math.random()*modes.length)];
            config.colorMode = colorModes[Math.floor(Math.random()*colorModes.length)];
            config.bgMode = bgModes[Math.floor(Math.random()*bgModes.length)];
            
            const rc = () => '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
            config.textColor = rc();
            config.strokeColor = rc();
            config.bgColor1 = rc();
            config.bgColor2 = rc();
            
            config.speed = 1 + Math.floor(Math.random()*3); 
            config.amplitude = 10 + Math.random()*40; 
            config.padding = 20 + Math.floor(Math.random()*60);
            
            config.strokeWidth = Math.random() > 0.6 ? Math.random() * 8 : 0;
            config.shadowBlur = Math.random() > 0.6 ? Math.random() * 40 : 0;
            config.tracking = (Math.random() - 0.3) * 10;
            
            updateUI();
        }

        function updateUI() {
            const el = id => document.getElementById(id);
            const set = (id,v) => { if(el(id)) el(id).value = v; };
            const txt = (id,v) => { if(el(id)) el(id).innerText = v; };
            
            set('select-font', config.fontFamily);
            set('select-anim-mode', config.animMode);
            set('select-color-mode', config.colorMode);
            set('select-bg-mode', config.bgMode);
            set('input-text-color', config.textColor);
            set('input-stroke-color', config.strokeColor);
            set('input-bg-color-1', config.bgColor1);
            set('input-bg-color-2', config.bgColor2);
            set('input-speed', config.speed);
            txt('val-speed', config.speed.toFixed(0));
            set('input-amp', config.amplitude);
            txt('val-amp', Math.floor(config.amplitude));
            set('input-padding', config.padding);
            txt('val-padding', config.padding+'px');
            set('input-tracking', config.tracking);
            txt('val-tracking', Math.floor(config.tracking));
            set('input-stroke', config.strokeWidth);
            txt('val-stroke', Math.floor(config.strokeWidth));
            set('input-shadow', config.shadowBlur);
            txt('val-shadow', Math.floor(config.shadowBlur));

            // Logic to preserve the "Click Here" text unless user has interacted
            if (state.textInteracted) {
                set('input-text', config.text);
            }
            // If user hasn't interacted, we do NOT update input-text, 
            // preserving the instruction message.
            
            checkBgMode();
        }

        function checkBgMode() {
            const grp = document.getElementById('bg-color-2-group');
            if (config.bgMode === 'solid' || config.bgMode === 'transparent') {
                grp.classList.add('opacity-30', 'pointer-events-none');
            } else {
                grp.classList.remove('opacity-30', 'pointer-events-none');
            }
        }

        function setupUI() {
            const bind = (id, k, type='val') => {
                const e = document.getElementById(id);
                if(!e) return;
                e.addEventListener('input', ev => {
                    config[k] = type === 'num' ? parseFloat(ev.target.value) : ev.target.value;
                    let label = document.getElementById(`val-${k}`);
                    if(k === 'strokeWidth') label = document.getElementById('val-stroke');
                    if(k === 'shadowBlur') label = document.getElementById('val-shadow');
                    if(label) label.innerText = (type==='num') ? Math.floor(config[k]) : config[k];
                    if(k === 'bgMode') checkBgMode();
                });
            };
            
            // Special binding for Text Input to handle the "Click Here" logic
            const textInput = document.getElementById('input-text');
            const defaultInstruction = "Click Here to Create Your Own Text GIF";

            if (textInput) {
                textInput.addEventListener('focus', () => {
                    if (textInput.value === defaultInstruction) {
                        textInput.value = "";
                        state.textInteracted = true;
                        // Don't update config.text yet, keep it as "VIBE\nGIF" until they type
                    }
                });

                textInput.addEventListener('input', (e) => {
                    state.textInteracted = true;
                    config.text = e.target.value;
                });
            }

            // bind('input-text', 'text'); // REMOVED standard bind for text, handled above
            bind('input-speed', 'speed', 'num');
            bind('input-amp', 'amplitude', 'num');
            bind('input-padding', 'padding', 'num');
            bind('input-tracking', 'tracking', 'num');
            bind('input-text-color', 'textColor');
            bind('input-stroke-color', 'strokeColor');
            bind('input-bg-color-1', 'bgColor1');
            bind('input-bg-color-2', 'bgColor2');
            bind('select-font', 'fontFamily');
            bind('select-anim-mode', 'animMode');
            bind('select-color-mode', 'colorMode');
            bind('select-bg-mode', 'bgMode');
            bind('input-gif-duration', 'gifDuration', 'num');
            bind('input-gif-fps', 'gifFps', 'num');
            bind('input-gif-size', 'gifWidth', 'num');
            bind('input-stroke', 'strokeWidth', 'num');
            bind('input-shadow', 'shadowBlur', 'num');

            document.querySelectorAll('.ratio-btn').forEach(b => {
                b.addEventListener('click', e => {
                    config.aspectRatio = { w: parseInt(e.target.dataset.w), h: parseInt(e.target.dataset.h) };
                    resize();
                });
            });

            // Close logic
            const menuBtn = document.getElementById('menu-btn');
            const panel = document.getElementById('settings-panel');
            const body = document.body;
            
            const toggleMenu = () => {
                state.isMenuOpen = !state.isMenuOpen;
                // Use class toggling instead of direct transform manipulation
                panel.classList.toggle('open', state.isMenuOpen);
                body.classList.toggle('menu-open', state.isMenuOpen);
                
                menuBtn.classList.toggle('active', state.isMenuOpen);
            };

            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMenu();
            });

            // Close on click outside or ESC
            window.addEventListener('click', (e) => {
                if (state.isMenuOpen && !panel.contains(e.target) && !menuBtn.contains(e.target)) {
                    toggleMenu();
                }
            });
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && state.isMenuOpen) {
                    toggleMenu();
                }
            });

            document.getElementById('btn-random').addEventListener('click', () => { if(state.transitionStage==='none') state.transitionStage='out'; });
            document.getElementById('btn-reset').addEventListener('click', () => {
                config.fontFamily="Inter"; config.animMode="liquid"; config.colorMode="solid"; config.speed=1.0; config.bgMode="solid";
                config.bgColor1="#000000"; config.bgColor2="#1a1a1a"; config.strokeWidth=0; config.shadowBlur=0; config.tracking=0;
                // Reset text interaction state
                state.textInteracted = false;
                config.text = "VIBE\nGIF";
                document.getElementById('input-text').value = defaultInstruction;
                
                updateUI();
            });
            document.getElementById('btn-export-gif').addEventListener('click', generateGIF);
        }

        // --- HELPER: Calculate brightness of a hex color ---
        function getLuminance(hex) {
            const rgb = parseInt(hex.slice(1), 16);
            const r = (rgb >> 16) & 0xff;
            const g = (rgb >>  8) & 0xff;
            const b = (rgb >>  0) & 0xff;
            // Standard relative luminance formula
            return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        }

        function generateGIF() {
            if (!state.workerUrl) return alert("System loading...");
            state.isRendering = true;
            document.getElementById('render-status').classList.remove('hidden');
            document.getElementById('render-status').classList.add('flex');

            let targetW = state.width;
            let targetH = state.height;
            if (config.gifWidth > 0 && config.gifWidth < state.width) {
                targetW = config.gifWidth;
                targetH = Math.round(targetW * (state.height / state.width));
            }

            // --- ADAPTIVE MATTE LOGIC ---
            // If text is light (>128 lum), use BLACK matte (Dark Shadow)
            // If text is dark (<128 lum), use WHITE matte (Light Glow)
            let adaptiveMatteColor = '#000000';
            let adaptiveMatteHex = 0x000000;
            
            if (config.bgMode === 'transparent') {
                const textLum = getLuminance(config.textColor);
                if (textLum < 100) { // Dark Text
                    adaptiveMatteColor = '#FFFFFF';
                    adaptiveMatteHex = 0xFFFFFF;
                }
            }

            const gifOptions = {
                workers: 4, 
                quality: 10, 
                width: targetW, 
                height: targetH, 
                workerScript: state.workerUrl
            };
            
            if (config.bgMode === 'transparent') {
                gifOptions.transparent = adaptiveMatteHex;
            }

            const gif = new GIF(gifOptions);

            const cvs = document.createElement('canvas');
            cvs.width = targetW; cvs.height = targetH;
            const cx = cvs.getContext('2d');
            
            // --- UPDATED: Ensure frames are calculated precisely ---
            const frames = Math.round(config.gifDuration * config.gifFps);
            const dt = config.gifDuration / frames;

            for (let i = 0; i < frames; i++) {
                const t = i * dt;
                // Pass adaptive color to draw function
                draw(dt, t, cx, targetW, targetH, adaptiveMatteColor);
                // dispose: 2 restores to background color (which is key) to prevent stacking
                gif.addFrame(cvs, {copy: true, delay: dt * 1000, dispose: 2});
            }

            gif.on('progress', p => document.getElementById('render-progress').innerText = Math.round(p*100)+'%');
            gif.on('finished', blob => {
                state.isRendering = false;
                document.getElementById('render-status').classList.remove('flex');
                document.getElementById('render-status').classList.add('hidden');
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                
                // --- FILENAME GENERATION ---
                const safeText = config.text.replace(/[^a-z0-9]/gi, '_').substring(0, 20);
                const safeMotion = config.animMode.replace(/_/g, '-');
                const safeFont = config.fontFamily.replace(/ /g, '-');
                a.download = `${safeText}-${safeMotion}-${safeFont}.gif`;
                
                a.click();
            });
            gif.render();
        }

        init();
    </script>
</body>
</html>
